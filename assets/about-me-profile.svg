<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="85" y1="90" x2="427" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D12BFF"/>
      <stop offset="0.5" stop-color="#6D5BFF"/>
      <stop offset="1" stop-color="#19E6E0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The circle fills the viewBox, so it aligns cleanly with the parent icon -->
  <circle cx="256" cy="256" r="239"
          fill="#080B20"
          stroke="url(#g)"
          stroke-width="14"
          filter="url(#glow)"/>

  <!-- Head -->
  <circle cx="256" cy="204" r="61"
          fill="none"
          stroke="url(#g)"
          stroke-width="15"
          stroke-linecap="round"
          filter="url(#glow)"/>

  <!-- Shoulders -->
  <path d="M145 382
           C145 320 192 284 256 284
           C320 284 367 320 367 382"
        fill="none"
        stroke="url(#g)"
        stroke-width="15"
        stroke-linecap="round"
        filter="url(#glow)"/>
</svg>