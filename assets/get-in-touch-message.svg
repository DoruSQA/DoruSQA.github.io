           C143 430 132 424 134 413
           L146 350
           H141
           C114 350 92 329 92 302 Z"
        fill="#11162C"
        stroke="url(#g)"
        stroke-width="15"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Conversation dots -->
  <circle cx="175" cy="210" r="18" fill="#D12BFF"/>
  <circle cx="256" cy="210" r="18" fill="#6D5BFF"/>
  <circle cx="337" cy="210" r="18" fill="#19E6E0"/>
