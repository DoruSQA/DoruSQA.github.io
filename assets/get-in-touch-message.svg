<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="92" y1="105" x2="420" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D12BFF"/>
      <stop offset="0.48" stop-color="#6D5BFF"/>
      <stop offset="1" stop-color="#19E6E0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="92" fill="#080B20"/>

  <!-- Message bubble -->
  <path d="M92 118
           C92 91 114 70 141 70
